version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  # The latest-Home-Assistant canary in tests.yaml.
  - package-ecosystem: pip
    directory: /.github/ha-latest
    schedule:
      interval: weekly
    labels:
      - dependencies
