name: HACS Validation

# HACS's own checks: repository structure, hacs.json, manifest, brand icon,
# description, topics. Push and pull request only while the repository is
# private, to keep Actions minutes for the checks that matter.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate with HACS Action
    # The HACS action can only validate public repositories.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          # While the repository is private, HACS's action fetches hacs.json and
          # the manifest anonymously and gets a 404, so these two checks cannot
          # pass. tests/test_hacs.py makes them locally with HACS's own schemas.
          # REMOVE THIS LINE when the repository goes public.
          ignore: hacsjson integration_manifest
