<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 262" width="1180" height="262" role="img" aria-label="Setup is four pages: sign in, see the meters and how far their data reaches, choose how much history, then the exact Energy dashboard statistics to pick."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="52" width="250" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,65.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10a4 4 0 1 0-3.2 3.9L13 16h2v2h2v2h3v-3l-5.1-5.1c.1-.3.1-.6.1-.9z M8 9h.01"/></g><text x="71.0" y="80.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">1. Sign in</text><text x="40.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Bright app email and</text><text x="40.0" y="122.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">password, checked live</text><rect x="318" y="52" width="250" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(334.0,65.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 1 0 0-13z M15.5 15.5 20 20"/></g><text x="365.0" y="80.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">2. Your meters</text><text x="334.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">each stream and how far</text><text x="334.0" y="122.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">its data reaches</text><rect x="612" y="52" width="250" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(628.0,65.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v15H4z M4 10h16 M8 3v5 M16 3v5 M8 14h2 M14 14h2 M8 17.5h2"/></g><text x="659.0" y="80.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">3. History</text><text x="628.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">days to import on the</text><text x="628.0" y="122.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">first pass (365)</text><rect x="906" y="52" width="250" height="128" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(922.0,65.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4 M4 20h16 M8 16v-5 M12 16V8 M16 16v-3"/></g><text x="953.0" y="80.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">4. Energy dashboard</text><text x="922.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">which statistic goes</text><text x="922.0" y="122.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">in which field</text><polyline points="282,116.0 310,116.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="576,116.0 604,116.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="870,116.0 898,116.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><line x1="24" y1="210" x2="1156" y2="210" stroke="#232a33" stroke-width="1"/><text x="24.0" y="236.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Page 4 also names any sources the dashboard already has, so the same meter is never counted twice.</text></svg>