<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="Every 30 minutes HalfPast Meter asks Glowmarkt how far each stream reaches, then a background import reads the hourly readings, checks them, and writes them to the recorder in one batch."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="52.0" y="26" width="196" height="44" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(68.0,38.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7 M20 4v4.5h-4.5"/></g><text x="99.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600">HalfPast Meter</text><line x1="150" y1="70" x2="150" y2="574" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="492.0" y="26" width="196" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(508.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 9.5 4.3 4.3 0 0 0 7 18z"/></g><text x="539.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Glowmarkt API</text><line x1="590" y1="70" x2="590" y2="574" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="932.0" y="26" width="196" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(948.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="979.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Recorder</text><line x1="1030" y1="70" x2="1030" y2="574" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="30" y="92" width="1120" height="150" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/><text x="44.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="start" font-weight="600">Poll: every 30 minutes</text><polyline points="158,132 582,132" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="370.0" y="123.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">catchup (at most every 2 h)</text><polyline points="158,170 582,170" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="370.0" y="161.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">last-time, each stream</text><polyline points="582,204 158,204" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="370.0" y="195.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">newest half-hour held</text><polyline points="158,232 582,232" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="370.0" y="223.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">tariff (every 6 h)</text><rect x="30" y="260" width="1120" height="300" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/><text x="44.0" y="278.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="start" font-weight="600">Import: in the background, per stream</text><polyline points="158,300 1022,300" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="291.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">last stored hour, and the total before the window</text><polyline points="1022,332 158,332" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="590.0" y="323.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">anchor sum</text><polyline points="158,370 582,370" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="370.0" y="361.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">readings PT1H nulls=1, 30-day chunks</text><polyline points="582,404 158,404" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="370.0" y="395.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">[hour, kWh or null] rows</text><polyline points="150,426 204,426 204,452 156,452" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="216.0" y="430.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">one row per hour, in order; errors stop the pass</text><polyline points="158,482 1022,482" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="473.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">hours already stored in the window</text><polyline points="150,504 204,504 204,530 156,530" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="216.0" y="508.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">readings + flat rows for stored gaps</text><polyline points="158,548 1022,548" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="539.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">async_add_external_statistics, one batch</text><line x1="24" y1="588" x2="1156" y2="588" stroke="#232a33" stroke-width="1"/><text x="24.0" y="614.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Nothing is written until every read has succeeded, so a failure leaves the stored history exactly as it was.</text></svg>